<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MoodWhisper</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@400;600&family=Dancing+Script:wght@500&display=swap" rel="stylesheet">
  <style>
      body {
          font-family: 'Poppins', sans-serif;
      }
      h1, h2,h3 {
          font-family: 'Playfair Display', serif;
      }
      .handwriting {
          font-family: 'Dancing Script', cursive;
      }
  </style>
</head>
<body class="bg-gradient-to-b from-pink-50 to-purple-100 text-gray-800">
  
    <!-- 导航栏 -->
    <nav class="flex justify-between items-center p-4 bg-white shadow-md">
        <h1 class="text-xl font-bold text-primary">MoodWhisper</h1>
        <div>
            
            <a href="profile.html" class="bg-primary text-black px-4 py-2 rounded-lg hover:bg-pink-400">
                返回
            </a>
            
        </div>
    </nav>

  
    <div class="max-w-md mx-auto mt-10 bg-white p-8 rounded-xl shadow-lg">
    <h2 class="text-2xl font-bold text-center text-pink-500">编辑个人信息</h2>
    <!-- 头像预览 -->
    <div class="mb-4 text-center">
        <img id="avatar-preview" src="images/example.jpg" alt="头像预览" class="w-24 h-24 rounded-full mx-auto mb-2 object-cover">
    </div>
  
    <form id="profile-form" class="mt-6">
      <label class="block font-semibold text-sm mb-1">签名</label>
      <input type="text" id="signature" class="w-full border px-4 py-2 rounded-lg mb-4" placeholder="填写你的签名">

      <label class="block font-semibold text-sm mb-1">头像链接</label>
      <input type="text" id="avatar" class="w-full border px-4 py-2 rounded-lg mb-4" placeholder="填写头像图片地址">

      <button type="submit" class="w-full bg-pink-400 hover:bg-pink-500 text-white py-2 rounded-lg shadow-md transition">
        保存修改
      </button>
    </form>

    <p id="update-message" class="text-center text-green-600 mt-4 hidden">保存成功！</p>
  </div>

  <footer class="text-center p-4 bg-white shadow-md mt-10">
    <p class="text-gray-500">&copy; 2025 MoodWhisper</p>
</footer>

  <script type="module" src="src/js/profile_edit.js"></script>
</body>
</html>
