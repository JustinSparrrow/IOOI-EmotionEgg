<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodWhisper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="src/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@400;600&family=Dancing+Script:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
        h1, h2,h3 {
            font-family: 'Playfair Display', serif;
        }
        .handwriting {
            font-family: 'Dancing Script', cursive;
        }
    </style>

</head>
<body class="bg-gradient-to-b from-pink-50 to-purple-100 text-gray-800">
    <!-- 导航栏 -->
    <nav class="flex justify-between items-center p-4 bg-white shadow-md">
        <h1 class="text-xl font-bold text-primary">MoodWhisper</h1>
        <div>
            <a href="community.html" class="text-secondary hover:underline mr-4">社区</a>
            <a href="profile.html" class="text-secondary hover:underline mr-4">个人中心</a>
            <button id="logout-btn" class="bg-primary text-black px-4 py-2 rounded-lg hover:bg-pink-400">
                退出
            </button>
            
        </div>
    </nav>

    <!-- 页面主体 -->
    <main class="container mx-auto px-6 py-10 space-y-12">
        <section class="bg-white rounded-xl shadow-lg p-6">
            <h3 class="text-xl font-semibold text-center mb-4">情绪日志</h3>
          
            <!-- 日选择器 + 查询按钮 -->
            <div class="flex justify-center gap-4 mb-6">
              <input type="date" id="log-date-selector" class="border border-gray-300 px-3 py-2 rounded-lg shadow-sm">
              <button id="log-query-button" class="query-button bg-gradient-to-br from-rose-500 to-pink-600">查看日志</button>
            </div>
          
            <!-- 情绪小人 -->
            <div class="text-center mb-6">
              <h3 class="text-lg font-semibold">你的情绪小人</h3>
              <div id="emotion-avatar" class="w-24 h-24 mx-auto mt-3 bg-white rounded-full shadow flex items-center justify-center text-4xl">
                
              </div>
            </div>
          
          
            <div id="interaction-log" class="bg-pink-50 p-4 rounded-lg shadow-md space-y-4 max-w-2xl mx-auto">
              <!-- JS 插入“您说”与“情绪助手说”的内容 -->
            </div>
          </section>

        <!-- 情绪趋势 -->
        <section class="bg-white rounded-xl shadow-lg p-6">
            <h3 class="text-xl font-semibold text-center mb-4">情绪趋势分析</h3>
            <div class="mt-6 flex justify-center space-x-6">
                <!-- 选择查询方式按钮 -->
                <button id="btn-year" class="px-6 py-3 bg-gradient-to-br from-rose-500 to-pink-600 text-white font-semibold rounded-xl 
                shadow-md hover:shadow-lg transition-all duration-200 
                transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-pink-400 focus:ring-opacity-75 
                active:scale-95 active:from-pink-700 tracking-wide">
                年
            </button>
            <button id="btn-month" class="px-6 py-3 bg-gradient-to-br from-rose-500 to-pink-600 text-white font-semibold rounded-xl 
                shadow-md hover:shadow-lg transition-all duration-200 
                transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-pink-400 focus:ring-opacity-75 
                active:scale-95 active:from-pink-700 tracking-wide">
                月
            </button>

            
            </div>

            <!-- 日期选择器 -->
            <div class="mt-4 flex flex-wrap justify-center gap-4">
                <!-- 年选择 -->
                <select id="year-selector" class="border border-gray-300 px-3 py-2 rounded-lg shadow-sm hidden"></select>

                <!-- 月选择 -->
                <select id="month-selector" class="border border-gray-300 px-3 py-2 rounded-lg shadow-sm hidden"></select>

                <!-- 查询按钮 -->
                <button id="query-button" class="query-button bg-gradient-to-br from-rose-500 to-pink-600 ">查询</button>    
                                
            </div>
                <!-- 图表区域 -->
                <div id="chart-container" class="mt-6 bg-white p-6 rounded-lg shadow-lg w-full max-w-4xl mx-auto hidden">
                    <canvas id="emotion-chart" class="w-full h-96"></canvas>
                </div>

                <!-- 无数据返回区域 -->
                <p  id="chart-message" 
                    class="mt-6 text-center text-lg font-semibold 
                    text-purple-800 
                    px-4 py-3 rounded-xl 
                    backdrop-blur-[2px]
                    hidden ">
                </p>
            
 

        <!-- 雕刻情绪陨石 -->
        <div class="mt-10 text-center">
            <h3 class="text-xl font-semibold">雕刻你的情绪陨石</h3>
            <div id="meteor-container" class="w-40 h-40 mx-auto mt-4 bg-gray-300 rounded-full shadow-lg flex items-center justify-center overflow-hidden">
                <video autoplay loop muted playsinline class="w-full h-full object-cover rounded-full">
                    <source src="./images/defult.mp4" type="video/mp4">
                    你的浏览器不支持 video 标签。
                </video>
            </div>

        </section>
    </main>

    <!-- 页脚 -->
    <footer class="text-center p-4 bg-white shadow-md mt-10">
        <p class="text-gray-500">&copy; 2025 MoodWhisper</p>
    </footer>

    <!-- 引入 Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script  type="module" src="src/js/dashboard.js"></script>

</body>
</html>

<style>
.query-button {
    background-color: #FF4B91; 
    color: white;
    font-weight: bold;
    padding: 12px 20px;
    border-radius: 8px;
    box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.15);
    transition: all 0.3s ease-in-out;
}

.query-button:hover {
    background-color: #E83E80; 
    transform: scale(1.05);
}

.query-button:active {
    background-color: #D13670; 
    transform: scale(0.98);
}

/* 图表区域默认隐藏 */
#chart-container {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.5s ease-out, transform 0.5s ease-out;
}

#chart-container.show {
    opacity: 1;
    transform: translateY(0);
}


</style>
