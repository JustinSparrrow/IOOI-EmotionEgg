<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情绪社区 - MoodWhisper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
        h1, h2 {
            font-family: 'Playfair Display', serif;
        }
        .handwriting {
            font-family: 'Dancing Script', cursive;
        }
    </style>
    <link rel="stylesheet" href="src/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@400;600&family=Dancing+Script:wght@500&display=swap" rel="stylesheet">
</head>
<body class="bg-gradient-to-b from-pink-50 to-purple-100 text-gray-800">

    <!-- 导航栏 -->
    <nav class="flex justify-between items-center p-4 bg-white shadow-md">
        <h1 class="text-xl font-bold text-primary">MoodWhisper</h1>
        <div>
            <a href="dashboard.html" class="text-secondary hover:underline mr-4">返回日志</a>
            <a href="profile.html" class="text-secondary hover:underline mr-4">个人中心</a>
            <button id="logout-btn" class="bg-primary text-black px-4 py-2 rounded-lg hover:bg-pink-400">
                退出
            </button>
        </div>
    </nav>

    <!-- 页面主体 -->
    <main class="container mx-auto px-6 py-10 max-w-3xl">
        <h2 class="text-3xl font-bold text-primary text-center">情绪社区</h2>

        <!-- 发布帖子 -->
        <section class="mt-8 bg-white p-4 rounded-lg shadow-lg">
            <h3 class="text-lg font-semibold">勇敢说出你的想法💪</h3>
            <textarea id="post-content" class="w-full border p-3 mt-2 rounded-lg resize-none h-24" placeholder="今天你的心情如何？"></textarea>
            <button id="post-btn" class="bg-primary text-white px-4 py-2 rounded-lg mt-3 hover:bg-pink-500">
                发布
            </button>
        </section>

        <!-- 社区帖子列表 -->
        <section class="mt-8">
            <h3 class="text-lg font-semibold mb-4"> 社区动态</h3>
            <div id="post-list" class="space-y-4">
                <!-- 这里是动态加载的帖子 -->
            </div>
        </section>
    </main>

    <!-- 页脚 -->
    <footer class="text-center p-4 bg-white shadow-md mt-10">
        <p class="text-gray-500">&copy; 2025 MoodWhisper</p>
    </footer>

    <!-- 引入 JavaScript -->
    <script type="module"  src="src/js/community.js"></script>
</body>
</html>
