<body class="bg-gradient-to-b from-pink-50 to-purple-100 text-gray-800">

<style>
/* GetStart按钮格式 */
.get-started-btn {
  width: 180px;
  height: 54px; 
  margin-top: 20px;
  display: inline-block;
  position: relative;
  cursor: pointer;
  box-sizing: border-box;
  border-radius: 30px;
  border: 3px solid #000;
  transition: all 0.3s ease;
  text-align: center;
  background-color: #C084FC; 
  line-height: 54px;
  color: #fff;
  font-size: 18px;
  letter-spacing: 2px;
  font-weight: bold;
}

.get-started-btn .dot {
  position: absolute;
  transition: transform calc(var(--speed) / 14) ease;
  width: var(--size);
  height: var(--size);
  transform: translate(var(--starting-x), var(--starting-y));
  z-index: 2;
}

.get-started-btn .dot::after {
  content: '';
  animation: hoverFirefly var(--speed) infinite, hoverFireFlicker calc(var(--speed) / 3) infinite calc(var(--speed) / 3);
  animation-play-state: paused;
  display: block;
  border-radius: 100%;
  background:  #C084FC;
  width: 100%;
  height: 100%;
  box-shadow: 0px 0px 6px 0px #F9A8D4, 0px 0px 4px 0px #C084FC inset, 0px 0px 2px 1px #C084FC;
}

.get-started-btn .dot1 {
  --speed: 14s;
  --size: 6px;
  --starting-x: 30px;
  --starting-y: 20px;
  top: 3px;
  left: -14px;
  opacity: 0.7;
}

.get-started-btn .dot2 {
  --speed: 16s;
  --size: 3px;
  --starting-x: 40px;
  --starting-y: 10px;
  top: 0px;
  left: -4px;
  opacity: 0.7;
}

.get-started-btn .dot3 {
  --speed: 20s;
  --size: 4px;
  --starting-x: -10px;
  --starting-y: 20px;
  top: -8px;
  right: 14px;
}

.get-started-btn .dot4 {
  --speed: 18s;
  --size: 2px;
  --starting-x: -30px;
  --starting-y: -5px;
  bottom: 4px;
  right: -14px;
  opacity: 0.9;
}

.get-started-btn .dot5 {
  --speed: 22s;
  --size: 5px;
  --starting-x: -40px;
  --starting-y: -20px;
  bottom: -6px;
  right: -3px;
}

.get-started-btn .dot6 {
  --speed: 15s;
  --size: 4px;
  --starting-x: 12px;
  --starting-y: -18px;
  bottom: -12px;
  left: 30px;
  opacity: 0.7;
}

.get-started-btn .dot7 {
  --speed: 19s;
  --size: 3px;
  --starting-x: 6px;
  --starting-y: -20px;
  bottom: -16px;
  left: 44px;
}

/* 按钮的 hover 状态 */
.get-started-btn:hover {
  transform: scale(1.05);
  background-color: #D8B4FE;
  box-shadow: 0px 0px 20px 5px rgba(216, 180, 254, 0.7);
  .dot {
    transform: translate(0, 0);
    &::after {
      animation-play-state: running;
    }
  }

  .get-started-btn {
    span {
      letter-spacing: 4px;
    }

    &::before,
    &::after {
      opacity: 1;
    }
  }
}

@keyframes hoverFirefly {
  0% {
    transform: translate(0, 0);
  }
  12% {
    transform: translate(4px, 2px);
  }
  24% {
    transform: translate(-3px, 4px);
  }
  37% {
    transform: translate(3px, -3px);
  }
  55% {
    transform: translate(-2px, 0);
  }
  74% {
    transform: translate(0, 3px);
  }
  88% {
    transform: translate(-4px, -2px);
  }
  100% {
    transform: translate(0, 0);
  }
}

@keyframes hoverFireFlicker {
  0% {
    opacity: 1;
  }
  25% {
    opacity: 0.3;
  }
  50% {
    opacity: 0.8;
  }
  75% {
    opacity: 0.4;
  }
  100% {
    opacity: 1;
  }
}

</style>
